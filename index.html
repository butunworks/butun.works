<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bütün Works — coming soon</title>
<meta name="description" content="bütün Works builds apps and agentic AI systems. Coming soon.">
<link rel="icon" href="mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #010002; --fg: #FEFFFD; --muted: #A9AAA8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; gap: 28px; }
  .mark { width: min(220px, 50vw); height: auto; }
  .word { font-family: Oswald, sans-serif; font-weight: 600; font-size: clamp(44px, 9vw, 72px); line-height: 1; letter-spacing: 1px; margin: 0; }
  .word span { display: block; font-weight: 500; font-size: 0.34em; letter-spacing: 0.9em; margin: 14px 0 0 0.9em; color: var(--muted); text-transform: none; }
  .line { margin: 0; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.5; max-width: 34ch; color: var(--fg); }
  .soon { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  footer { padding: 24px 16px; text-align: center; font-size: 14px; color: var(--muted); }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <img class="mark" src="mark.png" alt="bütün Works logo mark">
  <h1 class="word">bütün<span>Works</span></h1>
  <p class="line">We build apps and agentic AI systems.</p>
  <p class="soon">Coming soon</p>
</main>
<footer>© 2026 bütün Works · Istanbul</footer>
</body>
</html>
